name: Release package
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check tag and package version
        run: python -c 'import os, watch; assert os.environ["GITHUB_REF_NAME"] == "v" + watch.__version__'
      - run: python -m unittest -v
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: dma-watch --version
      - run: sha256sum dist/* > dist/SHA256SUMS.txt
      - name: Publish versioned installation artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "DMA Project Watch $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
